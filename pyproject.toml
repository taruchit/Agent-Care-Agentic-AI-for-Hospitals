[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-care"
version = "0.1.0"
description = "Agentic AI for Hospitals"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "db*"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]